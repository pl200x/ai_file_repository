server.port=8087
spring.application.name=file_management

# 支持从 IDEA 直接运行：根据工作目录加载根目录中被 Git 忽略的 .env。
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${FILE_DB_URL:jdbc:mysql://localhost:3306/file_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
# 默认5分钟：大文档整篇同步做embedding时容易超过这个值，导致consumer被判定假死、被踢出消费组
# （chunk-splitting分区从此没人消费，offset也提交不了），调大给embedding调用留够余量
spring.kafka.consumer.properties.max.poll.interval.ms=1800000

# OpenAI 配置。密钥只从环境变量或根目录的 .env 注入，不写入源码。
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5.4-mini}
spring.ai.openai.chat.temperature=${OPENAI_TEMPERATURE:0.1}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# 内置文档客服：只注册 topKSimilarity 一个工具。
customer-support.max-iterations=${AGENT_MAX_ITERATIONS:4}
customer-support.memory.max-messages=${AGENT_MEMORY_MAX_MESSAGES:20}
customer-support.search.top-k=${AGENT_TOP_K:6}

# ===== Milvus =====
spring.ai.vectorstore.milvus.client.host=localhost
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.collection-name=rag_demo
# 必须和 embedding 模型的维度一致：text-embedding-3-small = 1536
spring.ai.vectorstore.milvus.embedding-dimension=1536
spring.ai.vectorstore.milvus.index-type=IVF_FLAT
spring.ai.vectorstore.milvus.metric-type=COSINE
# 启动时自动建 collection 和索引，省去手动初始化
spring.ai.vectorstore.milvus.initialize-schema=true
# ===== 文本切分（ChunkSplittingConsumer）=====
# token 数按 embedding 模型的计量口径，和 milvus 的 embedding-dimension 无关
rag.chunk.token-size=800
# 一个 chunk 至少多少字符才回退到按标点断句
rag.chunk.min-chars=350
# 短于这个长度的碎片直接丢弃，不做 embedding
rag.chunk.min-length-to-embed=5
# 单篇文档最多切多少片，兜住超大文件
rag.chunk.max-num=10000
rag.chunk.keep-separator=true

# ===== PDF 接入（PdfExtractionService / PdfExportService）=====
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# 应用层再收紧一道，风格对齐 topK 的 @Value 校验写法
rag.pdf.max-size-bytes=20971520
# 导出 PDF 用的内嵌中文字体，必须是 TrueType（glyf）轮廓，OpenType/CFF 轮廓会报错
rag.pdf.export-font-path=classpath:fonts/NotoSansSC-Regular.ttf

# ===== Markdown 接入（MarkdownExtractionService）=====
# 纯文本，5MB 足够；按扩展名而非content-type判断，见MarkdownExtractionService注释
rag.markdown.max-size-bytes=5242880

# 两路召回的逐条明细（各路原始召回顺序、每条命中的名次与RRF分）走DEBUG。
# 只想看每次检索一行汇总就删掉这行——汇总是INFO，grep "hybrid recall done"
logging.level.com.example.file_management.service.impl.ChunkServiceImpl=DEBUG
